name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new Rust release can't turn new clippy lints into red CI
  # overnight. Bump deliberately (and fix any new lints) when upgrading.
  RUST_VERSION: "1.99.1"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # nokhwa's V4L2 backend generates bindings with bindgen → needs libclang.
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # rustup is preinstalled on GitHub runners; no third-party action needed.
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy && rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
